# DINOv3 Phase B: Domain Adaptation Config (ViT-Small Plus)
# S+ 模型比 S 模型略大，使用了更多数据预训练

train:
  dataset_path: ImageFolder:root=./data/images:split=TRAIN
  centering: "sinkhorn_knopp"
  batch_size_per_gpu: 32
  output_dir: "./runs/ssl_vits16plus"
  save_every_k_epochs: 10
  OFFICIAL_EPOCH_LENGTH: 1250

student:
  # ViT-S+/16 官方架构(vitsplus: swiglu FFN + 4 storage tokens)，
  # 已在 dinov3/models/vision_transformer.py 注册为 vit_small_plus
  arch: "vit_small_plus"
  # 以下各项使架构与官方 checkpoint 完全一致(此前缺失导致官方 storage tokens/bias_mask 被静默丢弃)
  ffn_layer: "swiglu"
  norm_layer: "layernormbf16"
  n_storage_tokens: 4
  mask_k_bias: true
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-5
  drop_path_uniform: true
  pretrained_weights: ""

teacher:
  momentum_teacher: 0.996
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30

optim:
  # 与已完成的 100% TAPT 实验一致：32 epochs × OFFICIAL_EPOCH_LENGTH=1250 = 40000 步
  # 如需更长训练请明确调大（epochs: 100 约需 8.5 小时/次）
  epochs: 32
  weight_decay: 0.04
  lr: 2.0e-4
  # 与已完成的 100% TAPT 运行一致(0.8)；原值 10 会让 warmup 占 1 万步
  warmup_epochs: 0.8
  min_lr: 1.0e-6
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024

crops:
  local_crops_number: 8
  local_crops_scale: [0.05, 0.4]
  global_crops_scale: [0.4, 1.0]
  local_crops_size: 96
  global_crops_size: 224

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  separate_head: true